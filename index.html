<style>
  body { margin: 0; font-family: var(--font-sans, -apple-system, "Apple SD Gothic Neo", sans-serif); color: var(--foreground, #111); }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--border, #ddd); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 12px; color: inherit; cursor: pointer; font-family: inherit; }
  .seg button.on { background: var(--surface-primary, #eee); font-weight: 600; }
  .hint { font-size: 11px; color: var(--muted-foreground, #888); }
  #wrap { position: relative; height: 520px; border-radius: var(--radius, 10px); overflow: hidden; }
  #tip { position: absolute; pointer-events: none; background: var(--popover, #fff); color: var(--popover-foreground, #111); border: 1px solid var(--border, #ddd); border-radius: 8px; padding: 8px 10px; font-size: 12px; display: none; max-width: 230px; line-height: 1.45; }
  #tip b { display: block; margin-bottom: 2px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 16px; margin: 14px 0 10px; }
  .label { font-size: 11px; color: var(--muted-foreground, #888); }
  .value { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  td, th { padding: 6px 4px; border-bottom: 1px solid var(--border, #eee); text-align: left; vertical-align: top; }
  th { font-weight: 500; color: var(--muted-foreground, #888); font-size: 11px; }
  .src { color: var(--muted-foreground, #888); font-size: 11px; }
</style>

function tex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
function textPanel(w, h, bg, lines) { return tex(w, h, (g) => { g.fillStyle = bg; g.fillRect(0, 0, w, h); lines.forEach(l => { g.fillStyle = l.c || '#fff'; g.font = `${l.wt || 700} ${l.s}px ${KFONT}`; g.textAlign = 'center'; g.fillText(l.t, w / 2, l.y); }); }); }
const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.8 }, o));
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = (a) => a[Math.floor(rnd() * a.length)];

// ground: 26 m square drawn once, clipped to the 50 cm board edge
const GW = 26;
const groundTex = tex(1024, 1024, (g, w, h) => {
  const P = (x, z) => [(x + GW / 2) / GW * w, (z + GW / 2) / GW * h];
  g.fillStyle = '#7d9850'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26000; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(52,82,30,.28)' : 'rgba(178,196,118,.25)'; g.fillRect(Math.random() * w, Math.random() * h, 2, 3); }
  // trampled area in front of the stage and the walking path
  const blob = (x, z, rx, rz, a) => { const [cx, cz] = P(x, z); const gr = g.createRadialGradient(cx, cz, 0, cx, cz, rx / GW * w); gr.addColorStop(0, `rgba(176,160,110,${a})`); gr.addColorStop(1, 'rgba(176,160,110,0)'); g.save(); g.translate(cx, cz); g.scale(1, rz / rx); g.translate(-cx, -cz); g.fillStyle = gr; g.beginPath(); g.arc(cx, cz, rx / GW * w, 0, 7); g.fill(); g.restore(); };
  blob(0, -1.0, 5.5, 3.4, 0.55); blob(0.3, 4.8, 2, 4, 0.45); blob(3.2, 4.8, 2.3, 1.8, 0.4); blob(-5.8, 0.2, 1.6, 1.2, 0.35); blob(5.8, 0.2, 1.6, 1.2, 0.35);
});

  const hr = add(new THREE.Mesh(hairG, std(pick(HAIR))), p); hr.position.y = 1.57; hr.rotation.x = -0.25;
  [-1, 1].forEach(side => {
    const arm = new THREE.Group(); arm.position.set(side * 0.21, 1.3, 0); p.add(arm);
    const a = add(new THREE.Mesh(armG, top), arm); a.position.y = -0.27; tag(a, personInfo);
    if (cheer && (side === 1 || rnd() < 0.5)) arm.rotation.z = side * (2.6 + rnd() * 0.4);
    else if (phone && side === 1) arm.rotation.x = -1.3;
    else arm.rotation.z = side * 0.08;
  });
  if (bag) { const b = add(new THREE.Mesh(bagG, std(0xffffff)), p); b.position.set(-0.3, 0.72, 0.02); tag(b, { n: 'Bongdari (white trash bag)', d: [0.3, 0.4], src: 'Slide p.33' }); }
}
const SX = 0, SZ = -6;
// main crowd: dense at the barrier, thinning toward the back
let tries = 0, made = 0;
while (made < 48 && tries++ < 8000) {
  const z = -2.5 + Math.pow(rnd(), 1.7) * 5.6;
  const spread = 3.7 + (z + 2.5) * 0.1;
  const x = (rnd() * 2 - 1) * spread;
  const minGap = 0.5 + (z + 2.5) * 0.09;
  if (!free(x, z, minGap)) continue;
  if (Math.hypot(x + 4.0, z - 3.6) < 1.4) continue;
  if (x > 1.6 && z > 2.4) continue;
  person(x, z, SX + x * 0.3, SZ, { cheer: z < 0.6 && rnd() < 0.45, bag: rnd() < 0.25 });
  made++;
}
// queue at the trash zone counter
const bd = [Math.sin(-0.5), Math.cos(-0.5)], bp = [-Math.cos(-0.5), Math.sin(-0.5)];
for (let i = 0; i < 4; i++) { const qx = booth.position.x + bd[0] * 1.9 + bp[0] * (0.2 + i * 0.62), qz = booth.position.z + bd[1] * 1.9 + bp[1] * (0.2 + i * 0.62); person(qx, qz, booth.position.x, booth.position.z, { bag: i < 3 }); }
// visitors at the open containers
[[-5.6, 0.0, -6.0, -1.0], [-4.9, 0.4, -6.0, -1.0], [-6.2, 0.6, -6.0, -1.0], [5.6, 0.0, 6.0, -1.0], [4.9, 0.4, 6.0, -1.0]].forEach(([x, z, fx, fz]) => person(x, z, fx, fz, { bag: rnd() < 0.3 }));
// photo at the seagull standee
person(-3.4, 4.0, -2.0, 6.6, {}); person(-2.6, 5.3, -4.0, 3.6, { phone: true });
// people walking in from the entrance
[[0.3, 6.6], [0.5, 5.0], [-0.5, 5.6]].forEach(([x, z]) => person(x, z, 0, -6, { bag: rnd() < 0.5 }));

// ---------- scale handling ----------
let S = 30.3;
const fmt = (m) => (m * 100 / S).toFixed(1) + 'cm';
function applyScale() {
  site.scale.setScalar(100 / S);
  document.getElementById('vArea').textContent = `${(0.5 * S).toFixed(0)}×${(0.5 * S).toFixed(0)}m`;
  document.getElementById('vPerson').textContent = fmt(1.7);
  document.getElementById('vCont').textContent = fmt(6.06);
  document.getElementById('vMascot').textContent = fmt(1.7);
  document.getElementById('tbl').innerHTML = ITEMS.map(it => `<tr><td>${it.n}</td><td>${it.d.map(v => v + 'm').join(' × ')}</td><td>${it.d.map(v => (v * 100 / S).toFixed(1)).join(' × ')}cm</td><td class="src">${it.src}</td></tr>`).join('');
}
document.getElementById('seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S = +b.dataset.s; [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b)); applyScale(); });
applyScale();

// ---------- tooltip ----------
const tip = document.getElementById('tip'), ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointermove', e => {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(scene.children, true).find(h => { let o = h.object; while (o && !o.userData.info) o = o.parent; return o; });
  if (!hit) { tip.style.display = 'none'; return; }
  let o = hit.object; while (!o.userData.info) o = o.parent;
  const i = o.userData.info;
  const real = i.cm ? i.d.map(v => v + 'cm').join(' × ') : i.d.map(v => v + 'm').join(' × ');
  const model = i.cm || !i.d.length ? '' : `<br>Model: ${i.d.map(fmt).join(' × ')}`;
  tip.innerHTML = `<b>${i.n}</b>${real ? 'Real: ' + real : ''}${model}${i.src ? `<br><span class="src">${i.src}</span>` : ''}`;
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 240) + 'px';
  tip.style.top = (e.clientY - r.top + 14) + 'px';
});
renderer.domElement.addEventListener('pointerleave', () => tip.style.display = 'none');

new ResizeObserver(() => { const w = wrap.clientWidth, h = wrap.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }).observe(wrap);
if (location.search.includes('top')) camera.position.set(0, 120, 0.01);
if (location.search.includes('low')) { camera.position.set(14, 7, 34); controls.target.set(0, 2, 0); }
(function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>
